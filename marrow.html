<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Marrow test · FMGE Coach</title>
<style>
  :root{
    --ink:#23263A; --muted:#727892; --bg:#F7F8FC; --surface:#FFFFFF; --surface-2:#F4F6FD;
    --accent:#5B6EF5; --accent-ink:#4451D6; --accent-soft:#EEF0FF;
    --green:#2FA36B; --green-soft:#E7F6EF; --red:#E05860; --red-soft:#FDECEC; --amber:#E8930C;
    --border:#ECEEF6; --shadow:0 2px 10px rgba(35,40,80,.05); --shadow-lg:0 24px 60px rgba(35,40,80,.22);
    --r:18px;
    --serif:ui-serif,"Iowan Old Style",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);line-height:1.55;font-size:15px;background:var(--bg)}
  .hidden{display:none!important} .muted{color:var(--muted)}
  h1,h2,h3{margin:0}

  .device{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
  @media(min-width:600px){
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;
      background:radial-gradient(1000px 560px at 50% -6%, #e7ebfb, #d7dcf0 55%, #cdd2ea)}
    .device{width:min(460px,100%);height:min(920px,96vh);border-radius:30px;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.6)}
  }

  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.3px}
  .brand .mk{width:28px;height:28px;border-radius:9px;background:linear-gradient(140deg,var(--accent),#8b9bff);display:grid;place-items:center;color:#fff;font-size:14px}
  .btn{appearance:none;border:0;cursor:pointer;font-weight:800;font-size:15px;padding:14px 18px;border-radius:14px;background:var(--accent);color:#fff;width:100%;box-shadow:0 6px 16px rgba(91,110,245,.28)}
  .btn:disabled{opacity:.35;box-shadow:none;cursor:default}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--border);box-shadow:none}
  .btn.sm{padding:9px 14px;font-size:13.5px;width:auto;border-radius:11px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
  .sec{font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--ink);margin:22px 3px 12px}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
  .pill.clin{background:var(--accent-soft);color:var(--accent-ink)}

  .apphead{flex:none;height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--surface)}
  .stage{flex:1;position:relative;overflow:hidden}
  .screen{position:absolute;inset:0;overflow-y:auto;padding:6px 16px 20px;display:none;-webkit-overflow-scrolling:touch}
  .screen.active{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .opt{display:flex;gap:11px;align-items:center;border:1.5px solid var(--border);border-radius:13px;padding:12px 14px;margin-bottom:9px;font-size:14.5px;cursor:pointer}
  .opt .k{width:26px;height:26px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
  .opt.correct{border-color:var(--green);background:var(--green-soft)} .opt.correct .k{background:var(--green);color:#fff;border-color:transparent}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)} .opt.wrong .k{background:var(--red);color:#fff;border-color:transparent}
  .opt.answered{cursor:default}

  .listcard .row{display:flex;align-items:center;gap:13px;padding:15px 16px;border-top:1px solid var(--border);cursor:pointer} .listcard .row:first-child{border-top:0}
  .listcard .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:18px;flex:none}
  .listcard .t{flex:1;min-width:0} .listcard .t b{font-size:14.5px} .listcard .t p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .listcard .go{color:var(--muted);font-weight:800}

  .over{position:absolute;inset:0;background:var(--bg);z-index:80;display:none;flex-direction:column} .over.active{display:flex}
  .ohead{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface)}
  .obody{flex:1;overflow-y:auto;padding:18px} .ofoot{flex:none;display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--surface);border-top:1px solid var(--border)} .ofoot .sp{flex:1}
  .tbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:15px;cursor:pointer;color:var(--ink)}
  .qhead{color:var(--muted);font-size:12.5px;font-weight:700;margin-bottom:7px} .qtext{font-size:16px;font-weight:600;margin-bottom:14px;white-space:pre-wrap}
  .soltitle{display:flex;align-items:center;gap:9px;margin:16px 0 10px} .soltitle b{font-size:16px}
  .ans{font-weight:800;color:var(--green);margin-bottom:8px}
  .expl{font-size:14px;white-space:pre-wrap}
  .qimg{display:block;max-width:100%;border-radius:14px;border:1px solid var(--border);margin:12px 0}
  .empty{padding:30px 10px;text-align:center;color:var(--muted)}
  .score-hero{padding:26px 20px;text-align:center} .score-hero .big{font-family:var(--serif);font-size:52px;font-weight:600;letter-spacing:-1px;margin:4px 0;color:var(--accent-ink)}
  .delta{display:inline-flex;gap:7px;align-items:center;font-weight:800;font-size:14px;padding:7px 15px;border-radius:999px}
</style>
</head>
<body>

  <div class="device" id="device">
    <div class="layer" style="position:absolute;inset:0;display:flex;flex-direction:column">
      <div class="apphead">
        <button class="tbtn" onclick="goBack()">‹</button>
        <div class="brand"><span class="mk">📖</span> <span id="crumb">Marrow test</span></div>
      </div>

      <div class="stage">
        <!-- SUBJECTS -->
        <section class="screen active" id="s-subjects">
          <div class="sec">Choose a subject</div>
          <div class="card listcard" id="subjectsList"><div class="row"><div class="t"><span class="muted">Loading…</span></div></div></div>
        </section>

        <!-- CHAPTERS -->
        <section class="screen" id="s-chapters">
          <div class="sec" id="chaptersTitle">Choose a chapter</div>
          <div class="card listcard" id="chaptersList"></div>
        </section>
      </div>
    </div>

    <!-- QUIZ -->
    <div class="over" id="quizOver">
      <div class="ohead">
        <button class="tbtn" onclick="quitQuiz()">‹</button>
        <div><div style="font-weight:800;font-size:13.5px" id="quizTitle">Chapter</div><div class="muted" style="font-size:11px;font-weight:700" id="quizProg">Q1 of 1</div></div>
      </div>
      <div class="obody" id="qBody"></div>
      <div class="ofoot">
        <button class="btn ghost sm" onclick="stepQ(-1)" id="prevBtn">‹ Prev</button>
        <div class="sp"></div>
        <button class="btn sm" onclick="stepQ(1)" id="nextBtn">Next ▸</button>
      </div>
    </div>

    <!-- RESULTS -->
    <div class="over" id="resultsOver">
      <div class="ohead"><button class="tbtn" onclick="closeResults()">‹</button><b style="font-size:15px">Result</b><span style="width:34px"></span></div>
      <div class="obody" style="padding:0" id="resultsBody"></div>
    </div>
  </div>

<script>
  // ---- state ----
  let MANIFEST=[];
  let curSubject=null;     // manifest entry
  let curBank=null;        // full subject JSON, fetched lazily
  let curChapter=null;     // chapter object from curBank
  let curQuestions=[];     // current chapter's question list
  let curQIndex=0;
  let answers=[];          // parallel to curQuestions: selected option index, or null if unanswered

  function escapeHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelector('.stage').scrollTop=0;}

  function goBack(){
    if(document.getElementById('s-chapters').classList.contains('active')){renderSubjects();return;}
    location.href='index.html';
  }

  async function init(){
    try{
      MANIFEST=await(await fetch('marrow/manifest.json?v='+Date.now())).json();
      renderSubjects();
    }catch(e){
      document.getElementById('subjectsList').innerHTML='<div class="row"><div class="t"><span class="muted">Could not load marrow/manifest.json — open this app over http:// (e.g. python3 -m http.server), not as a local file.</span></div></div>';
    }
  }

  const SUBJECT_ICONS={'Anaesthesia':'💉','Anatomy':'🦴','Biochemistry':'🧪','Dermatology':'🧴','ENT':'👂','Forensic Medicine':'⚖️','Medicine':'🩺','Microbiology':'🦠','OBGYN':'🤰','Ophthalmology':'👁️','Orthopaedics':'🦵','PSM':'🌍','Pathology':'🔬','Pediatrics':'👶','Pharmacology':'💊','Psychiatry':'🧠','Radiology':'🩻','Surgery':'🔪'};

  function renderSubjects(){
    document.getElementById('crumb').textContent='Marrow test';
    curSubject=null;curBank=null;
    show('s-subjects');
    document.getElementById('subjectsList').innerHTML=MANIFEST.map(m=>
      `<div class="row" data-key="${m.key}"><div class="ic">${SUBJECT_ICONS[m.title]||'📚'}</div><div class="t"><b>${escapeHtml(m.title)}</b><p>${m.chapters} chapters · ${m.questions} questions</p></div><span class="go">▸</span></div>`
    ).join('');
    document.querySelectorAll('#subjectsList .row[data-key]').forEach(r=>r.onclick=()=>openSubject(r.dataset.key));
  }

  async function openSubject(key){
    const m=MANIFEST.find(x=>x.key===key);if(!m)return;
    curSubject=m;
    document.getElementById('chaptersList').innerHTML='<div class="row"><div class="t"><span class="muted">Loading…</span></div></div>';
    document.getElementById('chaptersTitle').textContent=m.title+' · choose a chapter';
    document.getElementById('crumb').textContent=m.title;
    show('s-chapters');
    try{
      curBank=await(await fetch('marrow/'+m.file+'?v='+Date.now())).json();
      document.getElementById('chaptersList').innerHTML=curBank.chapters.map(ch=>
        `<div class="row" data-no="${ch.no}"><div class="ic">${String(ch.no).padStart(2,'0')}</div><div class="t"><b>${escapeHtml(ch.title)}</b><p>${ch.questions.length} questions</p></div><span class="go">▸</span></div>`
      ).join('');
      document.querySelectorAll('#chaptersList .row[data-no]').forEach(r=>r.onclick=()=>startChapterQuiz(+r.dataset.no));
    }catch(e){
      document.getElementById('chaptersList').innerHTML='<div class="row"><div class="t"><span class="muted">Could not load '+escapeHtml(m.file)+'.</span></div></div>';
    }
  }

  function startChapterQuiz(no){
    curChapter=curBank.chapters.find(c=>c.no===no);
    if(!curChapter||!curChapter.questions.length)return;
    curQuestions=curChapter.questions;
    answers=curQuestions.map(()=>null);
    curQIndex=0;
    document.getElementById('quizTitle').textContent='Ch '+String(curChapter.no).padStart(2,'0')+' · '+curChapter.title;
    renderQ();
    document.getElementById('quizOver').classList.add('active');
  }

  function quitQuiz(){document.getElementById('quizOver').classList.remove('active');}

  function imgTag(im){return `<img class="qimg" src="marrow/${im.file}" loading="lazy" alt="question image ${im.ref}">`;}

  // Substitutes [[IMG:n]] markers with <img> tags; does NOT append leftovers, since a ref's
  // marker lives in exactly one of stem/explanation and this is called separately for each --
  // per-call leftover-appending would duplicate the other section's images.
  function substituteMarkers(text, images, usedOut){
    const byRef={};(images||[]).forEach(im=>byRef[im.ref]=im);
    return escapeHtml(text||'').replace(/\[\[IMG:(\d+)\]\]/g,(m,n)=>{
      const im=byRef[n];if(!im)return'';
      usedOut.add(Number(n));
      return imgTag(im);
    });
  }

  function selectAnswer(i){
    if(answers[curQIndex]!=null)return; // already answered, ignore further taps
    answers[curQIndex]=i;
    renderQ();
  }

  function renderQ(){
    const q=curQuestions[curQIndex];
    const letters='ABCDEFGH';
    const images=q.images||[];
    const picked=answers[curQIndex];
    const answered=picked!=null;
    const used=new Set(); // shared across stem+explanation: a ref's marker lives in exactly one
    const stemHtml=substituteMarkers(q.stem, images, used);

    let optsHtml=q.options.map((o,j)=>{
      let cls='opt'+(answered?' answered':'');
      if(answered){if(j===q.correct)cls+=' correct';else if(j===picked)cls+=' wrong';}
      return `<div class="${cls}" data-i="${j}"><span class="k">${letters[j]||j+1}</span> ${escapeHtml(o)}</div>`;
    }).join('');

    let revealHtml='';
    if(answered){
      const explHtml=substituteMarkers(q.explanation, images, used);
      const leftover=images.filter(im=>!used.has(im.ref)).map(imgTag).join('');
      revealHtml=
        `<div class="soltitle"><b>${picked===q.correct?'✅ Correct':'✗ Incorrect'}</b>${q.answer?`<span class="pill clin">Answer ${q.answer.toUpperCase()}</span>`:''}</div>`+
        (q.explanation?`<div class="expl">${explHtml}</div>`:'')+leftover;
    }

    document.getElementById('qBody').innerHTML=
      `<div class="qhead">${escapeHtml(curSubject.title)} · Ch ${String(curChapter.no).padStart(2,'0')} · Q${q.no}</div>`+
      `<div class="qtext">${stemHtml}</div>`+optsHtml+revealHtml;

    if(!answered){document.querySelectorAll('#qBody .opt[data-i]').forEach(el=>el.onclick=()=>selectAnswer(+el.dataset.i));}

    document.getElementById('quizProg').textContent='Q'+(curQIndex+1)+' of '+curQuestions.length;
    document.getElementById('prevBtn').disabled=curQIndex===0;
    document.getElementById('nextBtn').textContent=curQIndex===curQuestions.length-1?'Finish':'Next ▸';
  }

  function stepQ(d){
    if(d>0 && curQIndex===curQuestions.length-1){finishChapter();return;}
    const n=curQIndex+d;
    if(n<0||n>=curQuestions.length)return;
    curQIndex=n;renderQ();
  }

  function finishChapter(){
    quitQuiz();
    renderResults();
    document.getElementById('resultsOver').classList.add('active');
  }

  function renderResults(){
    const letters='ABCDEFGH';
    let correct=0,wrong=[],skipped=0;
    curQuestions.forEach((q,i)=>{
      const a=answers[i];
      if(a==null){skipped++;return;}
      if(a===q.correct)correct++;else wrong.push(i);
    });
    const total=curQuestions.length;
    const pct=total?Math.round(100*correct/total):0;
    const ok=pct>=50;
    const skipNote=skipped?`<span class="muted" style="font-size:12.5px;display:block;margin-top:6px">${skipped} skipped</span>`:'';
    const reviewRows=wrong.map(i=>{
      const q=curQuestions[i];
      const picked=answers[i];
      const preview=escapeHtml(q.stem.replace(/\[\[IMG:\d+\]\]/g,'').slice(0,70))+(q.stem.length>70?'…':'');
      return `<div class="row" data-i="${i}"><div class="t"><b>✗ Q${q.no} · ${preview}</b><p>You ${letters[picked]||'—'} · Correct ${letters[q.correct]||'—'}</p></div><span class="go">See ›</span></div>`;
    }).join('');
    document.getElementById('resultsBody').innerHTML=
      `<div class="score-hero"><div class="muted" style="font-weight:700">${escapeHtml(curSubject.title)} · Ch ${String(curChapter.no).padStart(2,'0')} · ${escapeHtml(curChapter.title)}</div>`+
      `<div class="big">${correct}<span style="font-size:22px;color:var(--muted)">/${total}</span></div>`+
      `<span class="delta" style="background:${ok?'var(--green-soft)':'var(--red-soft)'};color:${ok?'var(--green)':'var(--red)'}">${ok?'✅':'◔'} ${pct}% correct</span>${skipNote}</div>`+
      `<div style="padding:0 16px 16px">`+
      `<div class="sec">Review · wrong answers</div>`+
      `<div class="card listcard">${reviewRows||'<div class="row"><div class="t"><b>No wrong answers 🎉</b></div></div>'}</div>`+
      `<div style="margin:16px 0;display:flex;gap:10px">`+
      `<button class="btn ghost" onclick="retakeChapter()">Retake chapter</button>`+
      `<button class="btn" onclick="closeResults()">Done</button>`+
      `</div></div>`;
    document.querySelectorAll('#resultsBody .row[data-i]').forEach(r=>r.onclick=()=>reviewQuestion(+r.dataset.i));
  }

  function reviewQuestion(i){
    document.getElementById('resultsOver').classList.remove('active');
    curQIndex=i;renderQ();
    document.getElementById('quizOver').classList.add('active');
  }

  function retakeChapter(){
    document.getElementById('resultsOver').classList.remove('active');
    answers=curQuestions.map(()=>null);
    curQIndex=0;renderQ();
    document.getElementById('quizOver').classList.add('active');
  }

  function closeResults(){
    document.getElementById('resultsOver').classList.remove('active');
    show('s-chapters');
  }

  init();
</script>
</body>
</html>
